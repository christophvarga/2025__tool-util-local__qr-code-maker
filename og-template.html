<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        width: 1200px; height: 630px; overflow: hidden;
        font-family: 'Outfit', sans-serif;
        color: #f4f1ff;
        background:
            radial-gradient(820px 480px at 84% -10%, rgba(124, 108, 240, 0.22), transparent 62%),
            radial-gradient(700px 420px at -8% 110%, rgba(124, 108, 240, 0.12), transparent 60%),
            #07080f;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 88px;
        position: relative;
    }
    .left { max-width: 640px; }
    .brand-mark {
        display: grid; grid-template-columns: repeat(2, 16px); gap: 6px;
        margin-bottom: 38px;
    }
    .brand-mark span {
        width: 16px; height: 16px; border-radius: 5px; background: #7c6cf0;
    }
    .brand-mark span:nth-child(4) { background: #f4f1ff; }
    h1 {
        font-family: 'Fraunces', serif;
        font-size: 76px; font-weight: 600; line-height: 1.05;
        letter-spacing: -0.01em; margin-bottom: 26px;
    }
    h1 em { font-style: normal; color: #a89bff; }
    p.sub {
        font-size: 28px; font-weight: 300; line-height: 1.45;
        color: rgba(244, 241, 255, 0.78); margin-bottom: 42px;
    }
    .chip {
        display: inline-flex; align-items: center; gap: 12px;
        font-size: 24px; font-weight: 500; letter-spacing: 0.02em;
        padding: 14px 26px; border-radius: 999px;
        background: rgba(124, 108, 240, 0.16);
        border: 1.5px solid rgba(124, 108, 240, 0.55);
        color: #cfc6ff;
    }
    .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: #7c6cf0; }
    .qr-wrap {
        width: 340px; height: 340px; flex-shrink: 0;
        background: rgba(244, 241, 255, 0.04);
        border: 1.5px solid rgba(124, 108, 240, 0.35);
        border-radius: 36px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 40px 90px rgba(124, 108, 240, 0.18);
    }
    .qr { display: grid; grid-template-columns: repeat(13, 19px); grid-auto-rows: 19px; gap: 3px; }
    .qr i { border-radius: 6px; }
    .qr i.on { background: linear-gradient(135deg, #8d7df5, #6c5ce7); }
    .qr i.eye { background: #f4f1ff; border-radius: 7px; }
</style>
</head>
<body>
    <div class="left">
        <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
        <h1>QR-Code Generator<br><em>kostenlos &amp; privat</em></h1>
        <p class="sub">Links, WLAN, vCard &amp; mehr — mit Farben, Logos und Stil-Presets. 100% im Browser, ohne Anmeldung.</p>
        <div class="chip"><span class="dot"></span>qr.varga.media</div>
    </div>
    <div class="qr-wrap"><div class="qr" id="qr"></div></div>
    <script>
        // Deterministic decorative QR-like pattern with finder eyes.
        const N = 13, grid = document.getElementById('qr');
        const eye = (r, c) => (r < 3 && c < 3) || (r < 3 && c >= N - 3) || (r >= N - 3 && c < 3);
        const eyeCore = (r, c) => (r === 1 && c === 1) || (r === 1 && c === N - 2) || (r === N - 2 && c === 1);
        let seed = 7;
        const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
            const cell = document.createElement('i');
            if (eyeCore(r, c)) cell.className = 'eye';
            else if (eye(r, c)) cell.className = 'on';
            else cell.className = rnd() > 0.45 ? 'on' : '';
            grid.appendChild(cell);
        }
    </script>
</body>
</html>
